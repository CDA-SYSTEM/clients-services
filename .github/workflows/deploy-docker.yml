name: Deploy Spring Boot Docker

on:
  push:
    branches: [ "develop", "feature/config-deploy" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  packages: write
  contents: read

jobs:
  deploy-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set repository name to lowercase
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            # Iniciar sesión en GHCR desde el servidor
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descargar la última imagen
            docker pull ghcr.io/${{ env.REPO_LC }}:latest

            # Detener y eliminar contenedor existente
            docker stop clients-service || true
            docker rm clients-service || true

            # Iniciar nuevo contenedor
            docker run -d \
              --name clients-service \
              -p ${{ secrets.SERVER_PORT }}:${{ secrets.SERVER_PORT }} \
              -e SPRING_APPLICATION_NAME="${{ secrets.SPRING_APPLICATION_NAME }}" \
              -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
              -e SPRING_DATASOURCE_DRIVER_CLASS_NAME="${{ secrets.SPRING_DATASOURCE_DRIVER_CLASS_NAME }}" \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO="${{ secrets.SPRING_JPA_HIBERNATE_DDL_AUTO }}" \
              -e SPRING_JPA_SHOW_SQL="${{ secrets.SPRING_JPA_SHOW_SQL }}" \
              -e SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT="${{ secrets.SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT }}" \
              -e SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL="${{ secrets.SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL }}" \
              -e SPRING_FLYWAY_ENABLED="${{ secrets.SPRING_FLYWAY_ENABLED }}" \
              -e SPRING_FLYWAY_BASELINE_ON_MIGRATE="${{ secrets.SPRING_FLYWAY_BASELINE_ON_MIGRATE }}" \
              -e SPRING_FLYWAY_LOCATIONS="${{ secrets.SPRING_FLYWAY_LOCATIONS }}" \
              -e SPRING_RABBITMQ_HOST="${{ secrets.SPRING_RABBITMQ_HOST }}" \
              -e SPRING_RABBITMQ_PORT="${{ secrets.SPRING_RABBITMQ_PORT }}" \
              -e SPRING_RABBITMQ_USERNAME="${{ secrets.SPRING_RABBITMQ_USERNAME }}" \
              -e SPRING_RABBITMQ_PASSWORD="${{ secrets.SPRING_RABBITMQ_PASSWORD }}" \
              -e APP_MESSAGING_CLIENT_QUEUE="${{ secrets.APP_MESSAGING_CLIENT_QUEUE }}" \
              -e APP_MESSAGING_TRACKER_EXCHANGE="${{ secrets.APP_MESSAGING_TRACKER_EXCHANGE }}" \
              -e APP_MESSAGING_TRACKER_QUEUE="${{ secrets.APP_MESSAGING_TRACKER_QUEUE }}" \
              -e APP_API_KEY="${{ secrets.APP_API_KEY }}" \
              -e APP_SWAGGER_USER="${{ secrets.APP_SWAGGER_USER }}" \
              -e APP_SWAGGER_PASSWORD="${{ secrets.APP_SWAGGER_PASSWORD }}" \
              --restart unless-stopped \
              ghcr.io/${{ env.REPO_LC }}:latest

            # Limpiar imágenes antiguas
            docker image prune -f
